name: Windows Rust CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Run unit tests
        run: cargo test --verbose
      - name: Build optimized Windows binary
        run: cargo build --release --verbose
      - name: Show CLI help
        shell: pwsh
        run: |
          # 릴리스 빌드는 windows_subsystem = "windows"라 종료 코드가 1로 남을 수 있습니다.
          cargo run --release -- --help | Out-String | Write-Host
          if ($LASTEXITCODE -gt 1) { throw "cargo run --release -- --help failed (exit $LASTEXITCODE)." }
