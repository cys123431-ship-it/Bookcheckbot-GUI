[package]
name = "bookcheckbot"
version = "0.2.0"
edition = "2021"
description = "Windows 11 전자책 뷰어 화면을 개인 열람용 PNG로 캡처하는 Rust GUI (CLI 옵션 병행)"
license = "MIT"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
# 기본 백엔드(wgpu) 대신 가벼운 OpenGL(glow) 백엔드를 씁니다.
# 내장 그래픽/저사양 PC에서도 창이 바로 뜨도록 하기 위함입니다.
eframe = { version = "0.37", default-features = false, features = [
    "default_fonts",
    "glow",
    "wayland",
    "x11",
] }
enigo = "=0.1.3"
screenshots = "=0.8.10"

[[bin]]
name = "bookcheckbot"
path = "src/main.rs"

[profile.release]
opt-level = 2
